name: docs/site CI

on:
  push:
    branches: [main]
    paths: ['docs/site/**']
  pull_request:
    paths: ['docs/site/**']

defaults:
  run:
    working-directory: docs/site

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: docs/site/.nvmrc
      - name: Install pnpm from packageManager
        run: npm i -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm check:contrast
      - run: pnpm build
      # `base: '/ccbar/'` means the built HTML only resolves correctly when served
      # under that path, so both checks below run against a real preview server
      # instead of scanning dist/ or letting Lighthouse spin its own static root.
      - run: pnpm preview --host 127.0.0.1 --port 4321
      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4321/ccbar/ > /dev/null && exit 0
            sleep 1
          done
          echo "preview server never came up" >&2
          exit 1
      # Thresholds (mobile, 95+ on all four categories) live in lighthouserc.cjs
      - run: pnpm dlx @lhci/cli@0.15.1 autorun
      # Internal links only; external ones are somebody else's uptime
      - run: pnpm dlx linkinator@8.1.0 http://127.0.0.1:4321/ccbar/ --recurse --skip '^https?://(?!127\.0\.0\.1)'
      - if: always()
        run: pnpm exec astro preview stop
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: docs/site/.lighthouseci
          # .lighthouseci is a dotted directory, and upload-artifact skips hidden
          # files by default -- without this the report is silently never uploaded.
          include-hidden-files: true
          if-no-files-found: warn
